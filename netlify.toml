[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Every app route is prerendered to a real file (full SSG), so anything
# that falls through to this rule is a genuine 404 — don't soft-404 it
# by serving the home page with a 200.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # The Content-Security-Policy is NOT here: it carries a sha256 for each
    # inline script Nuxt emits, and one of those embeds the build id, so it
    # can only be written after the build. See scripts/write-csp.mjs, which
    # appends it to dist/_headers.

# Cache static assets aggressively (hashed filenames from Vite)
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
